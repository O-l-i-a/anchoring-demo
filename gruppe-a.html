<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gruppe A – Schätzfrage</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --accent: #c8f060;
    --text: #e8e8e8;
    --muted: #6b7280;
    --border: #2a2d3a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 28px;
  }

  .anchor-box {
    background: #0f1117;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 32px;
  }

  .anchor-box p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .anchor-box strong {
    color: var(--text);
    font-weight: 500;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(22px, 5vw, 28px);
    line-height: 1.3;
    margin-bottom: 32px;
    font-weight: 400;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 24px;
  }

  input[type="number"] {
    width: 100%;
    background: #0f1117;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    font-size: 28px;
    font-family: 'DM Serif Display', serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  input[type="number"]:focus {
    border-color: var(--accent);
  }

  .unit {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--muted);
    pointer-events: none;
  }

  button {
    width: 100%;
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .thanks {
    display: none;
    text-align: center;
    animation: fadeUp 0.4s ease both;
  }

  .thanks .big { font-family: 'DM Serif Display', serif; font-size: 36px; margin-bottom: 12px; }
  .thanks .sub { color: var(--muted); font-size: 14px; line-height: 1.6; }

  .error {
    color: #f87171;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>
<div class="card" id="form-card">
  <div class="label">Gruppe A · Schätzaufgabe</div>

  <div class="anchor-box">
    <p>Zur Orientierung: Die Einwohnerzahl von Kasachstan ist<br>
    <strong>größer oder kleiner als 5 Millionen?</strong></p>
  </div>

  <h1>Wie viele Millionen Einwohner hat Kasachstan?</h1>

  <div class="input-wrap">
    <input type="number" id="answer" placeholder="z.B. 12" min="0" max="500" step="0.1">
    <span class="unit">Millionen</span>
  </div>

  <p class="error" id="error-msg">Bitte eine Zahl eingeben.</p>

  <button id="submit-btn" onclick="submit()">Absenden →</button>
</div>

<div class="card thanks" id="thanks-card">
  <div class="big">Danke! 🎯</div>
  <div class="sub">Deine Schätzung wurde gespeichert.<br>Schau auf die Leinwand für die Auflösung.</div>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────
  // Trage hier deinen JSONBin Bin-ID und API-Key ein (siehe README)
  const BIN_ID  = '6a12f9386877513b27c54776';
  const API_KEY = '$2a$10$Pfixh29GMyIuRA4VTLizbOpyiL.jtD9/TpGnnITpjwAAW.dp0fG/S';
  const GROUP   = 'A';
  // ────────────────────────────────────────────────────────

  async function submit() {
    const val = parseFloat(document.getElementById('answer').value);
    const err = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    if (isNaN(val) || val <= 0) {
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Wird gespeichert…';

    try {
      // 1. Aktuelle Daten lesen
      const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      const getData = await getRes.json();
      const current = getData.record || { A: [], B: [] };

      // 2. Eigenen Wert hinzufügen
      current[GROUP].push(val);

      // 3. Zurückschreiben
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify(current)
      });

      document.getElementById('form-card').style.display = 'none';
      document.getElementById('thanks-card').style.display = 'block';
    } catch(e) {
      btn.disabled = false;
      btn.textContent = 'Absenden →';
      alert('Fehler beim Speichern. Bitte nochmal versuchen.');
    }
  }
</script>
</body>
</html>
